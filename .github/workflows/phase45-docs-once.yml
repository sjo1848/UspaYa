name: Phase 45 Docs Once

on:
  push:
    branches:
      - feat/web-courier-flow

permissions:
  contents: write

jobs:
  docs:
    if: ${{ contains(github.event.head_commit.message, '[run-phase45-docs]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-courier-flow
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Phase 4.5 documentation
        run: python infra/scripts/phase45-docs-patch.py
      - name: Format synchronized docs
        run: |
          pnpm exec prettier --write \
            README.md \
            docs/04-application/API-001-rest-contract.md \
            docs/04-application/WEB-001-frontend-contract.md \
            docs/05-qa/critical-order-scenarios.md
      - name: Verify synchronized tree
        run: |
          grep -q 'Fase 4.5 no añade nuevas mutaciones' docs/04-application/API-001-rest-contract.md
          grep -q 'Fase 4.5 — flujo Repartidor' docs/04-application/WEB-001-frontend-contract.md
          grep -q 'Frontend — Fases 4.1 a 4.5' README.md
          grep -q 'Cobertura Fase 4.5 — Repartidor' docs/05-qa/critical-order-scenarios.md
          pnpm check
      - name: Persist docs and self-clean
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase45-docs-once.yml infra/scripts/phase45-docs-patch.py
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: synchronize Phase 4.5 contracts"
          for attempt in 1 2 3 4 5; do
            git fetch origin feat/web-courier-flow
            if git rebase origin/feat/web-courier-flow && git push origin HEAD:feat/web-courier-flow; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
