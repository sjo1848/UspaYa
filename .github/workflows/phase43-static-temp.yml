name: Phase 43 Static Gate Temporary

on:
  push:
    branches:
      - feat/web-merchant-order-flow

permissions:
  contents: write

jobs:
  static:
    if: ${{ contains(github.event.head_commit.message, '[run-phase43-static]') && !contains(github.event.head_commit.message, '[phase43-static-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-merchant-order-flow
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: |
          pnpm exec prettier --write apps/api/src/modules/ordering/http/merchant-order-read.controller.ts apps/api/src/modules/ordering/http/orders.controller.ts apps/api/src/modules/ordering/infrastructure/merchant-order-read.integration.test.ts apps/api/src/modules/ordering/ordering.module.ts apps/api/src/shared/http/request-context.ts apps/api/src/shared/security/development-identity.guard.ts apps/web/src/App.vue apps/web/src/api/client.spec.ts apps/web/src/api/client.ts apps/web/src/components/merchant/MerchantOrderFlow.vue
      - name: Run repository check
        run: pnpm check
      - name: Commit formatted sources and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase43-static-temp.yml
          git add -A
          git commit -m "style: normalize Phase 4.3 sources [phase43-static-done]"
          git push origin HEAD:feat/web-merchant-order-flow
