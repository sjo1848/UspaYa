name: Phase 42 normalize web contract types once

on:
  push:
    branches:
      - feat/delivery-destination-snapshot

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/delivery-destination-snapshot
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize shared web API types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path('apps/web/src/api/client.ts')
          text = client.read_text()
          old = """export interface SubmitOrderRequest {\n  readonly orderId: string;\n  readonly deliveryId: string;\n  readonly paymentId: string;\n  readonly branchId: string;\n  readonly deliveryPin: string;\n  readonly items: readonly SubmitOrderItemRequest[];\n}\n"""
          new = """export interface SubmitOrderRequest {\n  readonly orderId: string;\n  readonly deliveryId: string;\n  readonly paymentId: string;\n  readonly branchId: string;\n  readonly deliveryPin: string;\n  readonly deliveryDestination: Readonly<{\n    readonly addressText: string;\n    readonly phone: string;\n    readonly reference?: string;\n    readonly lodging?: string;\n    readonly latitude?: number;\n    readonly longitude?: number;\n  }>;\n  readonly items: readonly SubmitOrderItemRequest[];\n}\n"""
          if old not in text:
              raise SystemExit('SubmitOrderRequest shape not found')
          text = text.replace(old, new, 1)

          old = """    readonly assignedAt?: string;\n  };\n}\n\nexport interface CourierTransitionResponse {\n"""
          new = """    readonly assignedAt?: string;\n    readonly destination: Readonly<{\n      readonly addressText: string;\n      readonly phone: string;\n      readonly reference: string | null;\n      readonly lodging: string | null;\n      readonly latitude: number | null;\n      readonly longitude: number | null;\n    }> | null;\n  };\n}\n\nexport interface CourierTransitionResponse {\n"""
          if old not in text:
              raise SystemExit('ActiveCourierDeliveryResponse insertion point not found')
          client.write_text(text.replace(old, new, 1))

          intent = Path('apps/web/src/customer/order-intent.ts')
          text = intent.read_text()
          block = """export type CustomerSubmitOrderRequest = SubmitOrderRequest & {\n  readonly deliveryDestination: Readonly<{\n    readonly addressText: string;\n    readonly phone: string;\n    readonly reference?: string;\n    readonly lodging?: string;\n    readonly latitude?: number;\n    readonly longitude?: number;\n  }>;\n};\n\n"""
          if block not in text:
              raise SystemExit('CustomerSubmitOrderRequest compatibility type not found')
          text = text.replace(block, '', 1)
          text = text.replace('readonly request: CustomerSubmitOrderRequest;', 'readonly request: SubmitOrderRequest;', 1)
          text = text.replace("): CustomerSubmitOrderRequest['deliveryDestination'] {", "): SubmitOrderRequest['deliveryDestination'] {", 1)
          intent.write_text(text)

          courier = Path('apps/web/src/components/courier/CourierDeliveryFlow.vue')
          text = courier.read_text()
          block = """type DeliveryDestination = Readonly<{\n  addressText: string;\n  phone: string;\n  reference: string | null;\n  lodging: string | null;\n  latitude: number | null;\n  longitude: number | null;\n}>;\ntype ActiveDelivery = ActiveCourierDeliveryResponse['delivery'] & {\n  readonly destination?: DeliveryDestination | null;\n};\n"""
          replacement = "type ActiveDelivery = ActiveCourierDeliveryResponse['delivery'];\n"
          if block not in text:
              raise SystemExit('Courier compatibility types not found')
          courier.write_text(text.replace(block, replacement, 1))
          PY
          pnpm exec prettier --write \
            apps/web/src/api/client.ts \
            apps/web/src/customer/order-intent.ts \
            apps/web/src/components/courier/CourierDeliveryFlow.vue \
            e2e/first-vertical.spec.ts
          rm .github/workflows/phase42-contract-types-once.yml
      - name: Commit normalization and self-cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(web): align shared API types with destination contract'
          git push origin HEAD:feat/delivery-destination-snapshot
