name: Phase 46 Test Fix Once

on:
  push:
    branches:
      - feat/web-browser-e2e-gate

permissions:
  contents: write

jobs:
  fix-test:
    if: ${{ contains(github.event.head_commit.message, '[run-phase46-test-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-browser-e2e-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rewrite receiver regression without this-alias
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/api/client.spec.ts')
          text = path.read_text()
          old = """  it('invokes the default global fetch with the global receiver', async () => {\n    let observedReceiver: unknown;\n    let observedInput: RequestInfo | URL | undefined;\n    const receiverFetch: typeof fetch = async function (\n      this: typeof globalThis,\n      input: RequestInfo | URL,\n    ) {\n      observedReceiver = this;\n      observedInput = input;\n      return new Response(JSON.stringify({ status: 'ok' }), {\n        status: 200,\n        headers: { 'content-type': 'application/json' },\n      });\n    };\n    vi.stubGlobal('fetch', receiverFetch);\n\n    try {\n      const client = new ApiClient('https://example.test/api/v1');\n      await expect(client.health()).resolves.toEqual({ status: 'ok' });\n      expect(observedReceiver).toBe(globalThis);\n      expect(observedInput).toBe('https://example.test/api/v1/health');\n    } finally {\n      vi.unstubAllGlobals();\n    }\n  });\n"""
          new = """  it('invokes the default global fetch with the global receiver', async () => {\n    let observedInput: RequestInfo | URL | undefined;\n    const receiverFetch: typeof fetch = async function (\n      this: typeof globalThis,\n      input: RequestInfo | URL,\n    ) {\n      expect(this).toBe(globalThis);\n      observedInput = input;\n      return new Response(JSON.stringify({ status: 'ok' }), {\n        status: 200,\n        headers: { 'content-type': 'application/json' },\n      });\n    };\n    vi.stubGlobal('fetch', receiverFetch);\n\n    try {\n      const client = new ApiClient('https://example.test/api/v1');\n      await expect(client.health()).resolves.toEqual({ status: 'ok' });\n      expect(observedInput).toBe('https://example.test/api/v1/health');\n    } finally {\n      vi.unstubAllGlobals();\n    }\n  });\n"""
          if old not in text:
              raise SystemExit('target test block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write apps/web/src/api/client.spec.ts
      - run: pnpm check
      - name: Persist fix and self-clean
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase46-test-fix-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(web): stabilize native fetch receiver regression"
          git fetch origin feat/web-browser-e2e-gate
          git rebase origin/feat/web-browser-e2e-gate
          git push origin HEAD:feat/web-browser-e2e-gate