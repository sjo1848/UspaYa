name: Phase 4.2 Finalize Temporary

on:
  push:
    branches:
      - feat/web-customer-order-flow-v2

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[run-phase42-finalize]') && !contains(github.event.head_commit.message, '[phase42-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-customer-order-flow-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply focused Phase 4.2 finalization
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {old[:80]!r}; got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          component = 'apps/web/src/components/customer/CustomerOrderFlow.vue'
          replace_once(component,
              '<Alert v-if="message" :variant="submitState === \'rejected\' ? \'destructive\' : \'default\'">',
              '<Alert v-if="message" aria-live="polite" :variant="submitState === \'rejected\' ? \'destructive\' : \'default\'">')
          replace_once(component,
              '<p v-if="correlationId" class="font-mono text-xs">Correlation ID: {{ correlationId }}</p>',
              '<p v-if="correlationId" class="font-mono text-xs">Código de referencia: {{ correlationId }}</p>')
          replace_once(component,
              '<Badge class="mt-2" variant="outline">{{ order.status }}</Badge>',
              '<Badge class="mt-2" variant="outline">{{ orderStatusLabel(order.status) }}</Badge>')
          replace_once(component,
              '<Badge class="mt-2" variant="outline">{{ order.payment?.status ?? \'SIN_PAGO\' }}</Badge>',
              '<Badge class="mt-2" variant="outline">{{ paymentStatusLabel(order.payment?.status) }}</Badge>')
          replace_once(component,
              "{{ order.delivery?.status ?? 'SIN_ENTREGA' }}",
              '{{ deliveryStatusLabel(order.delivery?.status) }}')
          replace_once(component,
              '    message.value = `${error.code}: ${error.message}`;',
              '    message.value = httpErrorMessage(error);')
          anchor = "function money(cents: number): string {"
          mappings = '''const ORDER_STATUS_LABELS: Readonly<Record<string, string>> = Object.freeze({
            SUBMITTED: 'Pedido enviado',
            PENDING_MERCHANT: 'El comercio está revisando tu pedido',
            CHANGE_PROPOSED: 'Necesitamos tu confirmación',
            ACCEPTED: 'Pedido aceptado',
            PREPARING: 'En preparación',
            READY: 'Listo',
            FULFILLED: 'Entregado',
            COMPLETED: 'Completado',
            CANCELLATION_REQUESTED: 'Cancelación en revisión',
            CANCELLED: 'Pedido cancelado',
            REJECTED: 'Pedido rechazado',
          });

          const PAYMENT_STATUS_LABELS: Readonly<Record<string, string>> = Object.freeze({
            PENDING: 'Pago pendiente',
            REPORTED: 'Pago informado',
            PROCESSING: 'Pago en validación',
            CONFIRMED: 'Pago confirmado',
            FAILED: 'Pago no confirmado',
            CANCELLED: 'Pago cancelado',
            REFUND_PENDING: 'Reembolso pendiente',
            PARTIALLY_REFUNDED: 'Reembolso parcial',
            REFUNDED: 'Reembolsado',
            CHARGEBACK: 'Pago revertido',
          });

          const DELIVERY_STATUS_LABELS: Readonly<Record<string, string>> = Object.freeze({
            REQUESTED: 'Entrega solicitada',
            PENDING_ASSIGNMENT: 'Buscando repartidor',
            OFFERED: 'Buscando repartidor',
            ASSIGNED: 'Repartidor asignado',
            READY_FOR_PICKUP: 'Listo para retirar',
            PICKUP_IN_PROGRESS: 'Retiro en curso',
            PICKED_UP: 'Pedido retirado',
            ON_THE_WAY: 'En camino',
            ARRIVED: 'El repartidor llegó',
            DELIVERED: 'Entregado',
            FAILED: 'Entrega con inconveniente',
            CANCELLED: 'Entrega cancelada',
          });

          const HTTP_ERROR_MESSAGES: Readonly<Record<string, string>> = Object.freeze({
            ROLE_FORBIDDEN: 'No tenés permiso para realizar esta acción.',
            ORDER_NOT_FOUND: 'El pedido no existe o ya no está disponible para este usuario.',
            INVALID_ORDER_SUBMISSION: 'El pedido no pudo enviarse con los datos actuales. Revisá el carrito y volvé a intentarlo.',
            IDEMPOTENCY_KEY_CONFLICT: 'La intención de envío cambió. Actualizá el estado antes de volver a intentar.',
            VERSION_CONFLICT: 'El pedido cambió en otro dispositivo. Actualizá el estado antes de continuar.',
          });

          function orderStatusLabel(status: string): string {
            return ORDER_STATUS_LABELS[status] ?? 'Estado actualizado';
          }

          function paymentStatusLabel(status: string | undefined): string {
            if (status === undefined) return 'Sin pago';
            return PAYMENT_STATUS_LABELS[status] ?? 'Estado de pago actualizado';
          }

          function deliveryStatusLabel(status: string | undefined): string {
            if (status === undefined) return 'Sin entrega';
            return DELIVERY_STATUS_LABELS[status] ?? 'Estado de entrega actualizado';
          }

          function httpErrorMessage(error: ApiHttpError): string {
            return HTTP_ERROR_MESSAGES[error.code] ?? 'La API no pudo completar la operación.';
          }

          '''
          replace_once(component, anchor, mappings + anchor)

          api = 'docs/04-application/API-001-rest-contract.md'
          replace_once(api,
              'Fase 3 completada. La primera vertical puede recorrer por HTTP desde creación hasta `COMPLETED`,\ncon consulta autorizada y sanitizada de auditoría por Pedido.\n\nEl cierre de Fase 3 no autoriza todavía el piloto real, el frontend funcional ni la autenticación\nproductiva.',
              'Fase 3 completada. La primera vertical puede recorrer por HTTP desde creación hasta `COMPLETED`,\ncon consulta autorizada y sanitizada de auditoría por Pedido. Fase 4.2 agrega únicamente el\nread-model mínimo de descubrimiento de sucursales requerido por el cliente; no amplía reglas de\nnegocio ni mutaciones.\n\nEl cierre de Fase 3 y el avance de Fase 4 no autorizan todavía el piloto real ni la autenticación\nproductiva.')
          replace_once(api,
              '### `GET /catalog/branches/{branchId}/products`',
              '''### `GET /catalog/branches`\n\nRoles: `CUSTOMER`, `MERCHANT_OPERATOR`, `OPERATIONS`.\n\nDevuelve únicamente sucursales activas de comercios activos que tengan al menos un producto activo.\nLa proyección mínima contiene `merchantId`, `merchantName`, `branchId` y `branchName`, con orden\nestable. No expone stock, horarios, cobertura ni datos administrativos.\n\n### `GET /catalog/branches/{branchId}/products`''')

          web = 'docs/04-application/WEB-001-frontend-contract.md'
          replace_once(web,
              'Fase 4 en curso. Fase 4.1 y la fundación UI 4.1.1 están implementadas en la rama de integración.\nEste documento gobierna la frontera web de la vertical ya cerrada por API-001. No redefine estados,\npermisos ni reglas de negocio.',
              'Fase 4 en curso. Fase 4.1 y la fundación UI están cerradas; Fase 4.2 cliente está\nimplementada y sometida a su puerta final de QA/documentación. Este documento gobierna la frontera\nweb de la vertical ya cerrada por API-001. No redefine estados, permisos ni reglas de negocio.')
          replace_once(web,
              '''No incluye todavía:\n\n- catálogo y carrito funcionales;\n- creación o seguimiento visual de pedido;\n- superficies del comercio;\n- superficies de operaciones;\n- superficies del repartidor;\n- PWA offline completa;\n- autenticación productiva;\n- identidad visual final ni Design System completo.''',
              '''Fase 4.2 incorpora además:\n\n- descubrimiento de sucursales activas mediante read-model mínimo;\n- catálogo y carrito local de una sola sucursal;\n- PIN de 4 a 6 dígitos mantenido solo en memoria;\n- `SubmitOrder` con intención inmutable e `Idempotency-Key` estable;\n- recuperación autoritativa ante resultado incierto antes de ofrecer retry;\n- seguimiento separado de Pedido, Pago y Entrega;\n- etiquetas visibles en español sin exponer estados técnicos como texto de usuario.\n\nContinúa fuera de alcance:\n\n- superficies del comercio, operaciones y repartidor;\n- PWA offline completa;\n- autenticación productiva;\n- identidad visual final ni Design System completo.''')

          readme = 'README.md'
          replace_once(readme,
              'Todavía faltan las superficies funcionales de cliente, comercio, operaciones y repartidor, además\nde autenticación productiva y validación local con actores reales.',
              'La superficie funcional del cliente está en Fase 4.2 y supera su puerta técnica antes de merge.\nTodavía faltan comercio, operaciones y repartidor, además de autenticación productiva y validación\nlocal con actores reales.')
          replace_once(readme,
              '### Frontend — Fases 4.1 y 4.1.1',
              '### Frontend — Fases 4.1, fundación UI y 4.2 cliente')
          replace_once(readme,
              '- sin router, Pinia ni Axios mientras no exista una necesidad demostrada.',
              '''- sin router, Pinia ni Axios mientras no exista una necesidad demostrada;\n- descubrimiento de sucursales activas y catálogo;\n- carrito local de una sola sucursal, cantidades 1..99 y total de previsualización;\n- PIN de entrega solo en memoria, sin `localStorage`, `sessionStorage` ni IndexedDB;\n- `SubmitOrder` con UUID propios e intención idempotente estable;\n- recuperación ante resultado incierto mediante consulta autoritativa por `orderId`;\n- seguimiento separado de Pedido, Pago y Entrega con etiquetas UX en español.''')
          replace_once(readme,
              'GET  /api/v1/catalog/branches/{branchId}/products',
              'GET  /api/v1/catalog/branches\nGET  /api/v1/catalog/branches/{branchId}/products')
          replace_once(readme,
              '''Con la fundación UI estabilizada, el siguiente incremento funcional es **Fase 4.2 cliente**:\ndescubrimiento de sucursales, catálogo, carrito de una sola sucursal, PIN, `SubmitOrder`\nidempotente, recuperación ante resultado incierto y seguimiento del Pedido.''',
              '''Tras cerrar la puerta de Fase 4.2, el siguiente incremento funcional es **Fase 4.3 comercio**:\ndescubrir pedidos accionables de la sucursal, revisar el estado autoritativo y ejecutar aceptación,\ninicio de preparación y `READY` sin ampliar todavía las excepciones fuera de DEV-001.''')

          qa = 'docs/05-qa/critical-order-scenarios.md'
          replace_once(qa,
              '## Invariante atómica de entrega final',
              '''## Cobertura frontend — Fase 4.2 cliente\n\n- descubrimiento de sucursales filtra comercios/sucursales inactivos y exige rol permitido;\n- carrito rechaza duplicados lógicos y limita cantidades a 1..99;\n- PIN de 4 a 6 dígitos no se persiste en storage del navegador;\n- doble toque no crea una segunda intención;\n- misma intención conserva UUID e `Idempotency-Key` durante retry;\n- fallo de red posterior al envío se representa como resultado incierto;\n- antes de reintentar se consulta `GET /orders/{orderId}`;\n- `404 ORDER_NOT_FOUND` autoritativo habilita retry de la misma intención;\n- producto desactivado provoca rechazo autoritativo, refresco de catálogo y retiro del carrito;\n- Pedido, Pago y Entrega se muestran separados y con etiquetas UX, no con códigos internos;\n- errores HTTP conservan `correlationId` para diagnóstico sin usar el código técnico como mensaje\n  principal de usuario.\n\n## Invariante atómica de entrega final''')
          PY
      - name: Format focused files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/customer/CustomerOrderFlow.vue \
            docs/04-application/API-001-rest-contract.md \
            docs/04-application/WEB-001-frontend-contract.md \
            docs/05-qa/critical-order-scenarios.md \
            README.md
      - name: Verify frontend tests and types
        run: |
          pnpm --filter @uspaya/web test
          pnpm --filter @uspaya/web typecheck
      - name: Remove temporary workflow
        run: git rm .github/workflows/phase42-finalize-temp.yml
      - name: Guard changed paths
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/phase42-finalize-temp.yml' \
            'README.md' \
            'apps/web/src/components/customer/CustomerOrderFlow.vue' \
            'docs/04-application/API-001-rest-contract.md' \
            'docs/04-application/WEB-001-frontend-contract.md' \
            'docs/05-qa/critical-order-scenarios.md' | sort)"
          test "$changed" = "$expected"
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align customer UX and Phase 4.2 docs [phase42-finalized]"
          git push origin HEAD:feat/web-customer-order-flow-v2
