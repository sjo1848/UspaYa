name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatting-diagnostic:
    name: Audit gate formatting diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier formatting
        run: |
          pnpm exec prettier --write \
            apps/api/src/modules/ordering/application/order-audit-query.service.ts \
            apps/api/src/modules/ordering/http/operations-orders.controller.ts \
            apps/api/src/modules/delivery/infrastructure/vertical-e2e.integration.test.ts

      - name: Upload canonical files
        uses: actions/upload-artifact@v4
        with:
          name: phase3-audit-prettier
          path: |
            apps/api/src/modules/ordering/application/order-audit-query.service.ts
            apps/api/src/modules/ordering/http/operations-orders.controller.ts
            apps/api/src/modules/delivery/infrastructure/vertical-e2e.integration.test.ts
          if-no-files-found: error
          retention-days: 1
