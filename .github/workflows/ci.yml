name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate canonical formatting
        run: pnpm format

      - name: Commit generated files to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml apps/web/src/styles.css docs/02-domain/order-transition-matrix.md eslint.config.mjs
          if git diff --cached --quiet; then
            echo 'Generated files already committed.'
          else
            git commit -m 'chore: lock dependencies and apply canonical formatting'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run quality gate
        run: pnpm check
