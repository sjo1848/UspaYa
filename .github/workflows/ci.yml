name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-test-fix:
    name: Apply verified health contract fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Patch the health assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/api.integration.test.ts')
          text = path.read_text()
          old = "    assert.deepEqual(await response.json(), { status: 'ok' });"
          new = """    const body = await readJson<{ service: string; status: string; timestamp: string }>(response);
              assert.equal(body.service, 'api');
              assert.equal(body.status, 'ok');
              assert.equal(Number.isNaN(Date.parse(body.timestamp)), false);"""
          if text.count(old) != 1:
              raise SystemExit('Expected health assertion was not found exactly once.')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit the targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/api.integration.test.ts
          git diff --cached --check
          git commit -m 'test(api): align health assertion with response contract'
          git push origin HEAD:${{ github.head_ref }}
