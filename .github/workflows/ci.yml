name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatting-diagnostic:
    name: Final delivery formatting diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier formatting
        run: |
          pnpm exec prettier --write \
            apps/api/src/modules/delivery/http/courier-final-delivery.controller.ts \
            apps/api/src/modules/delivery/infrastructure/final-delivery.integration.test.ts \
            apps/api/src/modules/payment/domain/payment.ts

      - name: Upload canonical files
        uses: actions/upload-artifact@v4
        with:
          name: final-delivery-prettier
          path: |
            apps/api/src/modules/delivery/http/courier-final-delivery.controller.ts
            apps/api/src/modules/delivery/infrastructure/final-delivery.integration.test.ts
            apps/api/src/modules/payment/domain/payment.ts
          if-no-files-found: error
          retention-days: 1
