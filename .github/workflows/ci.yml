name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    name: Normalize merchant transition files
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://uspaya:uspaya_dev_only@localhost:5432/uspaya?schema=public

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            apps/api/src/modules/ordering/application/merchant-order-transition.service.ts \
            apps/api/src/modules/ordering/http/merchant-orders.controller.ts \
            apps/api/src/modules/ordering/infrastructure/merchant-transitions.integration.test.ts

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/modules/ordering/application/merchant-order-transition.service.ts \
            apps/api/src/modules/ordering/http/merchant-orders.controller.ts \
            apps/api/src/modules/ordering/infrastructure/merchant-transitions.integration.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(api): format merchant transition increment'
          git push origin HEAD:${{ github.head_ref }}
