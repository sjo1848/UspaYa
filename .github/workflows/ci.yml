name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    name: Normalize operations assignment test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        run: pnpm exec prettier --write apps/api/src/modules/delivery/infrastructure/operations-assignment.integration.test.ts

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/modules/delivery/infrastructure/operations-assignment.integration.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(api): format operations assignment test'
          git push origin HEAD:${{ github.head_ref }}
