name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    name: Web formatting diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier formatting
        run: pnpm prettier --write apps/web/src/api/idempotency.ts apps/web/src/api/idempotency.spec.ts apps/web/src/App.vue

      - name: Upload canonical files
        uses: actions/upload-artifact@v4
        with:
          name: phase4-web-prettier
          path: |
            apps/web/src/api/idempotency.ts
            apps/web/src/api/idempotency.spec.ts
            apps/web/src/App.vue
          retention-days: 1
