name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error

      - name: Generate canonical formatting
        run: pnpm format

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: |
            apps/web/src/styles.css
            docs/02-domain/order-transition-matrix.md
            eslint.config.mjs
          if-no-files-found: error

      - name: Run quality gate
        run: pnpm check
