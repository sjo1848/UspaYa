name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Apply strict typing corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          delivery_path = Path('apps/api/src/modules/delivery/domain/delivery.ts')
          delivery = delivery_path.read_text()
          old_delivery = '  private assignedCourierId?: EntityId;'
          new_delivery = '  private assignedCourierId: EntityId | undefined;'
          if old_delivery in delivery:
              delivery = delivery.replace(old_delivery, new_delivery, 1)
              delivery_path.write_text(delivery)
          elif new_delivery not in delivery:
              raise SystemExit('Unexpected Delivery courier field declaration')

          submit_path = Path('apps/api/src/modules/ordering/application/submit-order.service.ts')
          submit = submit_path.read_text()
          old_response = '            responseBody: result as Prisma.InputJsonValue,'
          new_response = '''            responseBody: {
              orderId: result.orderId,
              deliveryId: result.deliveryId,
              status: result.status,
              version: result.version,
              totalCents: result.totalCents,
            },'''
          if old_response in submit:
              submit = submit.replace(old_response, new_response, 1)
              submit_path.write_text(submit)
          elif new_response not in submit:
              raise SystemExit('Unexpected idempotency response serialization')
          PY

      - name: Install dependencies and generate Prisma client
        run: |
          pnpm install --no-frozen-lockfile
          pnpm prisma:generate
          pnpm format

      - name: Commit generated lockfile and formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: apply strict typing fixes and canonical formatting'
          git push origin HEAD:${{ github.head_ref }}

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Run quality gate
        run: pnpm check
