name: Phase 4.3 Format Safe Temporary

on:
  push:
    branches:
      - feat/web-merchant-order-flow

permissions:
  contents: write

jobs:
  format:
    if: ${{ contains(github.event.head_commit.message, '[run-phase43-format-safe]') && !contains(github.event.head_commit.message, '[phase43-format-safe]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-merchant-order-flow
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 4.3 sources
        run: |
          pnpm exec prettier --write \
            apps/api/src/modules/ordering/infrastructure/merchant-order-read.integration.test.ts \
            apps/web/src/components/merchant/MerchantOrderFlow.vue
      - name: Guard changed paths
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(apps/api/src/modules/ordering/infrastructure/merchant-order-read\.integration\.test\.ts|apps/web/src/components/merchant/MerchantOrderFlow\.vue)$' || true)"
          test -z "$unexpected"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/modules/ordering/infrastructure/merchant-order-read.integration.test.ts \
            apps/web/src/components/merchant/MerchantOrderFlow.vue
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style: normalize Phase 4.3 sources [phase43-format-safe]"
          git push origin HEAD:feat/web-merchant-order-flow
