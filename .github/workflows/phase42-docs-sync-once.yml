name: Phase 42 sync docs once

on:
  push:
    branches:
      - feat/delivery-destination-snapshot

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/delivery-destination-snapshot
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Synchronize Phase 42 documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # README
          replace(
              'README.md',
              '**PHASE 4 — FRONTEND VERTICAL IN PROGRESS**',
              '**PHASE 4 — FRONTEND VERTICAL CLOSED / PRE-PILOT HARDENING**',
          )
          replace(
              'README.md',
              'La Fase 3 de API está cerrada. Fase 4.1 y 4.1.1 establecieron la frontera web y la fundación UI;\nFase 4.2 cerró el flujo funcional del cliente, Fase 4.3 cerró la superficie mínima del comercio,\nFase 4.4 cerró Operaciones y Fase 4.5 materializa el recorrido funcional del repartidor. El núcleo de dominio, persistencia transaccional, auditoría, idempotencia, Outbox, worker\ny el recorrido HTTP principal permanecen cubiertos por CI.',
              'La Fase 3 de API y la Fase 4 frontend están cerradas. Cliente, Comercio, Operaciones y Repartidor\nrecorren la primera vertical completa. Fase 4.6 agregó una puerta E2E real con Playwright/Chromium\nmóvil y recuperación de respuestas inciertas. El hardening pre-piloto incorpora ahora un snapshot\ninmutable de destino de entrega, sin ampliar estados ni reglas de negocio.',
          )
          replace(
              'README.md',
              'Todavía falta la puerta de Fase 4.6 con E2E de navegador/UX, además de autenticación productiva y\nvalidación local con actores reales. La recuperación durable del PIN tras recargar o\ncerrar la aplicación sigue siendo una brecha explícita previa al piloto.',
              'La puerta E2E de Fase 4.6 ya fue superada. El piloto continúa bloqueado por gates separados,\nentre ellos autenticación apta para piloto, recuperación durable del PIN tras recargar/cerrar,\nvalidación local con actores reales y el resto del hardening operativo, de seguridad y observabilidad.',
          )
          replace(
              'README.md',
              '- PIN normal de entrega, sin fallback en DEV-001;\n- actores y datos ficticios sembrados.',
              '- PIN normal de entrega, sin fallback en DEV-001;\n- dirección y teléfono congelados como snapshot de destino al enviar;\n- referencia y alojamiento opcionales;\n- actores y datos ficticios sembrados.',
          )
          replace(
              'README.md',
              '- creación idempotente de pedidos;\n- consulta protegida de pedidos;',
              '- creación idempotente de pedidos con snapshot inmutable de destino incluido en la intención;\n- persistencia transaccional de dirección/teléfono de entrega sin incluir esa PII en AuditLog ni Outbox;\n- consulta protegida de pedidos;',
          )
          replace(
              'README.md',
              '- repartidor: retiro, custodia, traslado, llegada y entrega final;',
              '- repartidor: retiro, custodia, traslado, llegada y entrega final; el destino se oculta antes de `PICKED_UP` y se expone solo al repartidor activamente asignado desde la transferencia de custodia;',
          )
          replace(
              'README.md',
              '### Frontend — Fases 4.1 a 4.5',
              '### Frontend — Fases 4.1 a 4.6 + hardening pre-piloto',
          )
          replace(
              'README.md',
              '- cliente: descubrimiento de sucursales, catálogo, carrito de una sola sucursal, SubmitOrder\n  idempotente y seguimiento separado de Order/Payment/Delivery;\n- PIN de 4–6 dígitos solo en memoria, nunca en storage persistente;',
              '- cliente: descubrimiento de sucursales, catálogo, carrito de una sola sucursal, SubmitOrder\n  idempotente y seguimiento separado de Order/Payment/Delivery;\n- checkout con dirección y teléfono obligatorios, referencia/alojamiento opcionales y snapshot incluido\n  en la intención inmutable; sin mapa, geocoding ni agenda de direcciones en este incremento;\n- PIN de 4–6 dígitos y datos de destino solo en memoria de la intención, nunca en storage persistente;',
          )
          replace(
              'README.md',
              '- repartidor: entrega activa, retiro/custodia, traslado, llegada y confirmación final;\n- repartidor: recuperación autoritativa ante pérdida de red sin reintentos ciegos;',
              '- repartidor: entrega activa, retiro/custodia, traslado, llegada y confirmación final;\n- repartidor: dirección/contacto ausentes en `ASSIGNED` y `PICKUP_IN_PROGRESS`, visibles desde\n  `PICKED_UP` mientras la asignación continúe activa;\n- repartidor: recuperación autoritativa ante pérdida de red sin reintentos ciegos;',
          )
          replace(
              'README.md',
              '- entrega final: intención inmutable con `Idempotency-Key` estable, PIN solo en memoria y replay\n  exacto para recuperar un resultado incierto.',
              '- entrega final: intención inmutable con `Idempotency-Key` estable, PIN solo en memoria y replay\n  exacto para recuperar un resultado incierto;\n- Playwright/Chromium móvil recorre Cliente → Comercio → Operaciones → Repartidor → Operaciones,\n  incluida la frontera temporal de privacidad del destino y la ausencia de PIN/dirección/teléfono en storage.',
          )
          replace(
              'README.md',
              'La metadata se sanitiza recursivamente para eliminar PIN, hashes, tokens, secretos, credenciales,\nclaves idempotentes, request hashes y API keys. El MVP no expone un buscador global de auditoría.',
              'La metadata se sanitiza recursivamente para eliminar PIN, hashes, tokens, secretos, credenciales,\nclaves idempotentes, request hashes y API keys. El snapshot de dirección/teléfono tampoco se publica\nen AuditLog ni Outbox. El MVP no expone un buscador global de auditoría.',
          )
          replace(
              'README.md',
              'La puerta de Fase 3 mantiene el E2E que recorre cliente, comercio, operaciones y repartidor desde\ncreación hasta `COMPLETED`. Fase 4 añade regresiones de frontend y read-models. Fase 4.3 cubre de\nforma explícita aislamiento horizontal, cuenta multirol, bandeja hasta `READY`, versión optimista y\nrecuperación visible.',
              'La puerta de Fase 3 mantiene el E2E HTTP que recorre cliente, comercio, operaciones y repartidor desde\ncreación hasta `COMPLETED`. Fase 4 añade regresiones de frontend/read-models y Fase 4.6 agrega el gate\nPlaywright/Chromium móvil sobre la vertical real. El hardening del destino añade regresiones de\npersistencia, idempotencia, no-filtración de PII y visibilidad temporal por custodia.',
          )
          replace(
              'README.md',
              'Después de cerrar y fusionar Fase 4.5, el siguiente incremento es **Fase 4.6 — E2E de navegador/UX, recuperación y puerta de cierre de la vertical frontend**.',
              'La Fase 4 está cerrada. Este incremento completa el **snapshot de destino de entrega** como hardening P0 pre-piloto. Después corresponde continuar únicamente con los blockers verificables del Gate C; este estado no autoriza todavía un piloto real.',
          )

          # API-001
          replace(
              'docs/04-application/API-001-rest-contract.md',
              'El avance de Fase 4 no autoriza todavía el piloto real ni la autenticación productiva.',
              'Fase 4.6 cerró además el gate de navegador/UX con Chromium móvil. El hardening pre-piloto\nañade el snapshot inmutable de destino de entrega y su frontera de privacidad para el repartidor.\nNinguno de estos cierres autoriza todavía el piloto real ni la autenticación productiva.',
          )
          replace(
              'docs/04-application/API-001-rest-contract.md',
              'El cliente genera UUID v4 para pedido, entrega, pago e ítems. El PIN se recibe solo en escritura y\nse persiste como derivación `scrypt` con sal. El fingerprint de idempotencia tampoco conserva una\nderivación SHA-256 barata del PIN.',
              'El cliente genera UUID v4 para pedido, entrega, pago e ítems. El PIN se recibe solo en escritura y\nse persiste como derivación `scrypt` con sal. El fingerprint de idempotencia tampoco conserva una\nderivación SHA-256 barata del PIN. La intención incluye además un `deliveryDestination` normalizado\ny congelado: dirección y teléfono son obligatorios; referencia/alojamiento son opcionales; latitud\ny longitud, si existen, deben aparecer juntas y respetar rangos geográficos. Cambiar el destino con\nla misma `Idempotency-Key` constituye una intención distinta y produce conflicto.',
          )
          replace(
              'docs/04-application/API-001-rest-contract.md',
              '  "deliveryPin": "4826",\n  "items": [',
              '  "deliveryPin": "4826",\n  "deliveryDestination": {\n    "addressText": "Av. Las Heras 120, Uspallata",\n    "phone": "+54 9 261 555 0101",\n    "reference": "Portón azul",\n    "lodging": "Hostería Uspallata",\n    "latitude": -32.593,\n    "longitude": -69.349\n  },\n  "items": [',
          )
          replace(
              'docs/04-application/API-001-rest-contract.md',
              '}\n```\n\n### `GET /orders/{orderId}`',
              '}\n```\n\nEl snapshot se persiste en la misma transacción serializable que Pedido/Pago/Entrega. Dirección y\nteléfono no se incluyen en la metadata de `SubmitOrder` ni en eventos de Outbox. `GET /orders/{orderId}`\ntampoco los expone. La proyección específica del repartidor es la única superficie de este incremento\nque puede devolverlos, y solo después de transferida la custodia.\n\n### `GET /orders/{orderId}`',
          )
          replace(
              'docs/04-application/API-001-rest-contract.md',
              'Devuelve proyección mínima de la entrega activa: identificadores, estado, versión, importes,\nestado del Pedido, sucursal y momento de asignación. No devuelve material de verificación.',
              'Devuelve proyección mínima de la entrega activa: identificadores, estado, versión, importes,\nestado del Pedido, sucursal y momento de asignación. No devuelve material de verificación.\n\nLa proyección contiene `destination: null` en `ASSIGNED` y `PICKUP_IN_PROGRESS`. Desde `PICKED_UP`\n(y mientras el actor conserve la asignación activa) puede incluir el snapshot congelado con\n`addressText`, `phone`, referencia/alojamiento y coordenadas opcionales. Una entrega ajena sigue\nresolviendo como `404 DELIVERY_NOT_FOUND`, por lo que otro repartidor no puede consultar esa PII.',
          )

          # WEB-001
          replace(
              'docs/04-application/WEB-001-frontend-contract.md',
              'Fase 4 en curso. Fase 4.1, fundación UI 4.1.1, cliente 4.2, comercio 4.3 y Operaciones 4.4 están cerrados. Fase 4.5 materializa la entrega activa del repartidor hasta la confirmación final sobre la vertical ya cerrada por API-001. Este documento gobierna la frontera web y no redefine estados, permisos ni reglas de negocio.',
              'Fase 4 cerrada. Fases 4.1 a 4.5 materializaron Cliente, Comercio, Operaciones y Repartidor; Fase 4.6 cerró la puerta E2E de navegador/UX con Playwright/Chromium móvil. El hardening pre-piloto añade el snapshot de destino y su frontera temporal de privacidad sin redefinir estados, permisos ni reglas de negocio. Este documento gobierna la frontera web.',
          )
          replace(
              'docs/04-application/WEB-001-frontend-contract.md',
              '- PIN, secretos y credenciales no se persisten en storage del navegador.',
              '- PIN, secretos, dirección y teléfono de entrega no se persisten en storage del navegador.',
          )
          replace(
              'docs/04-application/WEB-001-frontend-contract.md',
              'carrito local de una sola sucursal\n→ PIN\n→ crear intención inmutable',
              'carrito local de una sola sucursal\n→ destino + contacto + PIN\n→ crear intención inmutable',
          )
          replace(
              'docs/04-application/WEB-001-frontend-contract.md',
              '- `Idempotency-Key`;\n- payload exacto de la intención.',
              '- `Idempotency-Key`;\n- snapshot normalizado de dirección/teléfono y opcionales de referencia/alojamiento;\n- payload exacto de la intención.',
          )
          replace(
              'docs/04-application/WEB-001-frontend-contract.md',
              'Un doble toque no crea una segunda intención mientras el envío está activo. Si es necesario\nreintentar la misma operación, se reutilizan exactamente la misma clave, IDs y payload.\n\n### PIN',
              'Un doble toque no crea una segunda intención mientras el envío está activo. Si es necesario\nreintentar la misma operación, se reutilizan exactamente la misma clave, IDs y payload. Cambiar\ndirección o contacto exige una intención nueva; no se puede mutar un retry existente.\n\n### Destino de entrega\n\n- dirección y teléfono son obligatorios antes de habilitar SubmitOrder;\n- referencia y alojamiento son opcionales;\n- no se incorpora mapa, geocoding ni agenda de direcciones en este incremento;\n- el snapshot forma parte de la intención inmutable y no se escribe en `localStorage`,\n  `sessionStorage` ni IndexedDB;\n- el seguimiento general del cliente no vuelve a exponer el snapshot desde `GET /orders/{orderId}`.\n\n### PIN',
          )
          replace(
              'docs/04-application/WEB-001-frontend-contract.md',
              '- confirmar retiro exige responsable del comercio y al menos un bulto;\n- doble toque queda bloqueado mientras una mutación está pendiente.',
              '- confirmar retiro exige responsable del comercio y al menos un bulto;\n- dirección/contacto no se muestran en `ASSIGNED` ni `PICKUP_IN_PROGRESS`;\n- después de `ConfirmPickup → PICKED_UP`, la UI vuelve a consultar la entrega activa y muestra el\n  snapshot de destino solo mientras el repartidor siga activamente asignado;\n- doble toque queda bloqueado mientras una mutación está pendiente.',
          )
          replace(
              'docs/04-application/WEB-001-frontend-contract.md',
              '### Fase 4.5\n\n- entrega activa sin UUID hardcodeado;\n- retiro y custodia con evidencia estructurada;\n- traslado y llegada desde interfaz;\n- intención final idempotente e inmutable en memoria;\n- recuperación segura de transiciones normales y confirmación final;\n- PIN, receptor y efectivo tratados sin persistir el secreto;\n- tests de cliente HTTP, intención y decisiones de recuperación.\n\n## Fuera de alcance actual\n\n- E2E de navegador y puerta UX de Fase 4.6;',
              '### Fase 4.5\n\n- entrega activa sin UUID hardcodeado;\n- retiro y custodia con evidencia estructurada;\n- traslado y llegada desde interfaz;\n- intención final idempotente e inmutable en memoria;\n- recuperación segura de transiciones normales y confirmación final;\n- PIN, receptor y efectivo tratados sin persistir el secreto;\n- tests de cliente HTTP, intención y decisiones de recuperación.\n\n### Fase 4.6 y hardening de destino\n\n- Playwright/Chromium móvil recorre la vertical completa sin retries sobre estado mutado;\n- recuperación real ante pérdida deliberada de respuestas de comercio y entrega final;\n- dirección/teléfono ausentes de storage del navegador;\n- destino oculto al repartidor antes de `PICKED_UP` y visible después de la custodia;\n- contrato `ApiClient`, intención Cliente y respuesta Repartidor comparten los mismos tipos.\n\n## Fuera de alcance actual\n\n- mapa, geocoding y agenda/perfil de direcciones;',
          )

          PY
          pnpm exec prettier --write README.md docs/04-application/API-001-rest-contract.md docs/04-application/WEB-001-frontend-contract.md
          rm .github/workflows/phase42-docs-sync-once.yml
      - name: Commit docs and self-cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'docs: align destination snapshot contracts'
          git push origin HEAD:feat/delivery-destination-snapshot
