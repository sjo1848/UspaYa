name: UI Format Temporary

on:
  push:
    branches:
      - feat/web-shadcn-foundation

permissions:
  contents: write

jobs:
  format:
    if: ${{ contains(github.event.head_commit.message, '[run-ui-format]') && !contains(github.event.head_commit.message, '[ui-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/web-shadcn-foundation

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format only generated shadcn sources
        run: pnpm exec prettier --write apps/web/src/components/ui apps/web/src/lib/utils.ts

      - name: Guard changed paths
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(apps/web/src/components/ui/|apps/web/src/lib/utils\.ts$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected formatted paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/ui apps/web/src/lib/utils.ts
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style(web): normalize shadcn sources [ui-format]"
          git push origin HEAD:feat/web-shadcn-foundation
