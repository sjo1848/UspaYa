name: Phase 4.3 QA Format Temporary

on:
  push:
    branches:
      - feat/web-merchant-order-flow

permissions:
  contents: write

jobs:
  format:
    if: ${{ contains(github.event.head_commit.message, '[run-phase43-qa-format]') && !contains(github.event.head_commit.message, '[phase43-qa-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-merchant-order-flow
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/05-qa/critical-order-scenarios.md
      - name: Guard changed paths
        run: test "$(git diff --name-only)" = "docs/05-qa/critical-order-scenarios.md"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/05-qa/critical-order-scenarios.md
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style: normalize Phase 4.3 QA docs [phase43-qa-format]"
          git push origin HEAD:feat/web-merchant-order-flow
