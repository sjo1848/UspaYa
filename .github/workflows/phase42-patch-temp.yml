name: Phase 4.2 Patch Temporary

on:
  push:
    branches:
      - feat/web-customer-order-flow-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[run-phase42-patch]') && !contains(github.event.head_commit.message, '[phase42-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/web-customer-order-flow-v2

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply narrow type fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/customer/CustomerOrderFlow.vue')
          text = path.read_text()
          old = '''        <Button\n          v-if="submitState === 'retryable'"\n          variant="outline"\n          :disabled="submitState === 'submitting'"\n          @click="executeCurrentIntent"\n        >'''
          new = '''        <Button\n          v-if="submitState === 'retryable'"\n          variant="outline"\n          @click="executeCurrentIntent"\n        >'''
          if old not in text:
              raise SystemExit('Expected retry button block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/web/src/components/customer/CustomerOrderFlow.vue

      - name: Guard changed paths
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "apps/web/src/components/customer/CustomerOrderFlow.vue"

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/customer/CustomerOrderFlow.vue
          git commit -m "fix(web): remove impossible retry-state comparison [phase42-patch]"
          git push origin HEAD:feat/web-customer-order-flow-v2
