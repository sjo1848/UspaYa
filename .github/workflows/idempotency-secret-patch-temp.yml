name: Idempotency Secret Patch Temporary

on:
  push:
    branches:
      - feat/web-customer-order-flow-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[run-secret-patch]') && !contains(github.event.head_commit.message, '[secret-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/web-customer-order-flow-v2

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch protected request fingerprints
        run: |
          python - <<'PY'
          from pathlib import Path

          submit = Path('apps/api/src/modules/ordering/application/submit-order.service.ts')
          text = submit.read_text()
          text = text.replace(
              "import { createRequestHash, IdempotencyConflictError } from '../../shared/application/idempotency';",
              """import {\n  createProtectedRequestHash,\n  IdempotencyConflictError,\n  protectedRequestHashMatches,\n} from '../../shared/application/idempotency';""",
          )
          old = """    const requestHash = createRequestHash({\n      orderId: command.orderId,\n      deliveryId: command.deliveryId,\n      paymentId: command.paymentId,\n      customerId: command.customerId,\n      branchId: command.branchId,\n      plainTextPin: command.plainTextPin,\n      items: command.items,\n    });"""
          if old not in text:
              raise SystemExit('SubmitOrder request hash block not found')
          text = text.replace(old, "    const fingerprintInput = createFingerprintInput(command);", 1)
          text = text.replace(
              'return await this.executeTransaction(command, key, requestHash);',
              'return await this.executeTransaction(command, key, fingerprintInput);',
              1,
          )
          text = text.replace(
              'const recovered = await this.recoverConcurrentResult(key, requestHash);',
              """const recovered = await this.recoverConcurrentResult(\n          key,\n          fingerprintInput,\n          command.plainTextPin,\n        );""",
              1,
          )
          text = text.replace(
              """    requestHash: string,\n  ): Promise<SubmitOrderResult> {""",
              """    fingerprintInput: SubmitOrderFingerprintInput,\n  ): Promise<SubmitOrderResult> {""",
              1,
          )
          text = text.replace(
              """        if (existing.requestHash !== requestHash) {\n          throw new IdempotencyConflictError();\n        }""",
              """        if (\n          !protectedRequestHashMatches(\n            existing.requestHash,\n            fingerprintInput,\n            command.plainTextPin,\n          )\n        ) {\n          throw new IdempotencyConflictError();\n        }""",
              1,
          )
          text = text.replace(
              '        requestHash,\n        expiresAt:',
              '        requestHash: createProtectedRequestHash(fingerprintInput, command.plainTextPin),\n        expiresAt:',
              1,
          )
          text = text.replace(
              """  private async recoverConcurrentResult(\n    key: string,\n    requestHash: string,\n  ): Promise<SubmitOrderResult | undefined> {""",
              """  private async recoverConcurrentResult(\n    key: string,\n    fingerprintInput: SubmitOrderFingerprintInput,\n    plainTextPin: string,\n  ): Promise<SubmitOrderResult | undefined> {""",
              1,
          )
          if text.count('existing.requestHash !== requestHash') != 2:
              raise SystemExit('Unexpected SubmitOrder recovery comparison count')
          text = text.replace(
              'existing.requestHash !== requestHash',
              '!protectedRequestHashMatches(existing.requestHash, fingerprintInput, plainTextPin)',
          )
          marker = "\nfunction delay(milliseconds: number): Promise<void> {"
          addition = """
interface SubmitOrderFingerprintInput {
  readonly orderId: string;
  readonly deliveryId: string;
  readonly paymentId: string;
  readonly customerId: string;
  readonly branchId: string;
  readonly items: readonly SubmitOrderItemInput[];
}

function createFingerprintInput(command: SubmitOrderCommand): SubmitOrderFingerprintInput {
  return {
    orderId: command.orderId,
    deliveryId: command.deliveryId,
    paymentId: command.paymentId,
    customerId: command.customerId,
    branchId: command.branchId,
    items: command.items,
  };
}
"""
          if marker not in text:
              raise SystemExit('SubmitOrder insertion marker not found')
          text = text.replace(marker, addition + marker, 1)
          if 'plainTextPin: command.plainTextPin' in text.split('const fingerprintInput', 1)[1].split('for (let attempt', 1)[0]:
              raise SystemExit('PIN remained in public SubmitOrder fingerprint')
          submit.write_text(text)

          delivery = Path('apps/api/src/modules/delivery/application/confirm-delivery.service.ts')
          text = delivery.read_text()
          text = text.replace('  createRequestHash,\n  IdempotencyConflictError,\n', '', 1)
          anchor = "import { Payment } from '../../payment/domain/payment';\n"
          new_import = """import { Payment } from '../../payment/domain/payment';
import {
  createProtectedRequestHash,
  IdempotencyConflictError,
  protectedRequestHashMatches,
} from '../../shared/application/idempotency';
"""
          if anchor not in text:
              raise SystemExit('ConfirmDelivery import anchor not found')
          text = text.replace(anchor, new_import, 1)
          old = """    const requestHash = createRequestHash({\n      deliveryId: command.deliveryId,\n      actorId: command.actorId,\n      expectedVersion: command.expectedVersion,\n      pin: command.pin,\n      receiver: command.receiver,\n      cashReceivedCents: command.cashReceivedCents,\n    });"""
          if old not in text:
              raise SystemExit('ConfirmDelivery request hash block not found')
          text = text.replace(old, '    const fingerprintInput = createFingerprintInput(command);', 1)
          text = text.replace(
              'return await this.executeTransaction(command, key, requestHash);',
              'return await this.executeTransaction(command, key, fingerprintInput);',
              1,
          )
          text = text.replace(
              'const recovered = await this.recoverConcurrentResult(key, requestHash);',
              """const recovered = await this.recoverConcurrentResult(\n          key,\n          fingerprintInput,\n          command.pin,\n        );""",
              1,
          )
          text = text.replace(
              """    requestHash: string,\n  ): Promise<ConfirmDeliveryResult> {""",
              """    fingerprintInput: ConfirmDeliveryFingerprintInput,\n  ): Promise<ConfirmDeliveryResult> {""",
              1,
          )
          text = text.replace(
              """          if (existing.requestHash !== requestHash) {\n            throw new IdempotencyConflictError();\n          }""",
              """          if (\n            !protectedRequestHashMatches(existing.requestHash, fingerprintInput, command.pin)\n          ) {\n            throw new IdempotencyConflictError();\n          }""",
              1,
          )
          text = text.replace(
              '            requestHash,\n            status:',
              '            requestHash: createProtectedRequestHash(fingerprintInput, command.pin),\n            status:',
              1,
          )
          text = text.replace(
              """  private async recoverConcurrentResult(\n    key: string,\n    requestHash: string,\n  ): Promise<ConfirmDeliveryResult | undefined> {""",
              """  private async recoverConcurrentResult(\n    key: string,\n    fingerprintInput: ConfirmDeliveryFingerprintInput,\n    pin: string,\n  ): Promise<ConfirmDeliveryResult | undefined> {""",
              1,
          )
          if text.count('existing.requestHash !== requestHash') != 2:
              raise SystemExit('Unexpected ConfirmDelivery recovery comparison count')
          text = text.replace(
              'existing.requestHash !== requestHash',
              '!protectedRequestHashMatches(existing.requestHash, fingerprintInput, pin)',
          )
          marker = "\nfunction eventRow("
          addition = """
interface ConfirmDeliveryFingerprintInput {
  readonly deliveryId: string;
  readonly actorId: string;
  readonly expectedVersion: number;
  readonly receiver: string;
  readonly cashReceivedCents: number;
}

function createFingerprintInput(
  command: ConfirmDeliveryCommand,
): ConfirmDeliveryFingerprintInput {
  return {
    deliveryId: command.deliveryId,
    actorId: command.actorId,
    expectedVersion: command.expectedVersion,
    receiver: command.receiver,
    cashReceivedCents: command.cashReceivedCents,
  };
}
"""
          if marker not in text:
              raise SystemExit('ConfirmDelivery insertion marker not found')
          text = text.replace(marker, addition + marker, 1)
          delivery.write_text(text)
          PY
          pnpm exec prettier --write \
            apps/api/src/modules/ordering/application/submit-order.service.ts \
            apps/api/src/modules/delivery/application/confirm-delivery.service.ts

      - name: Guard changed paths
        run: |
          changed="$(git diff --name-only)"
          expected="apps/api/src/modules/delivery/application/confirm-delivery.service.ts
apps/api/src/modules/ordering/application/submit-order.service.ts"
          test "$changed" = "$expected"

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/modules/ordering/application/submit-order.service.ts \
            apps/api/src/modules/delivery/application/confirm-delivery.service.ts
          git commit -m "fix(security): protect PIN idempotency fingerprints [secret-patch]"
          git push origin HEAD:feat/web-customer-order-flow-v2
