name: Idempotency Secret Patch Temporary

on:
  push:
    branches:
      - feat/web-customer-order-flow-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[run-secret-patch]') && !contains(github.event.head_commit.message, '[secret-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-customer-order-flow-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply patch
        run: |
          python infra/scripts/patch-protected-idempotency.py
          pnpm exec prettier --write apps/api/src/modules/ordering/application/submit-order.service.ts apps/api/src/modules/delivery/application/confirm-delivery.service.ts
      - name: Guard changed paths
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(apps/api/src/modules/ordering/application/submit-order\.service\.ts|apps/api/src/modules/delivery/application/confirm-delivery\.service\.ts)$' || true)"
          test -z "$unexpected"
          test "$(git diff --name-only | wc -l)" -eq 2
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/ordering/application/submit-order.service.ts apps/api/src/modules/delivery/application/confirm-delivery.service.ts
          git commit -m "fix(security): protect PIN idempotency fingerprints [secret-patch]"
          git push origin HEAD:feat/web-customer-order-flow-v2
