name: Phase 44 Merge Once

on:
  push:
    branches:
      - feat/web-operations-flow

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: ${{ contains(github.event.head_commit.message, '[phase44-final-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-operations-flow
          fetch-depth: 0
      - name: Remove one-shot merge workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase44-merge-once.yml
          git commit -m "chore: remove Phase 4.4 merge helper"
          for attempt in 1 2 3 4 5; do
            git fetch origin feat/web-operations-flow
            if git rebase origin/feat/web-operations-flow && git push origin HEAD:feat/web-operations-flow; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
      - name: Mark PR ready and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready 40 --repo sjo1848/UspaYa || true
          gh pr merge 40 --repo sjo1848/UspaYa --squash \
            --subject "feat: implement operations assignment and closure flow (#40)" \
            --body "Close Fase 4.4 with available-courier and pending-completion read models, assignment and closure UI, authoritative recovery, scoped audit, synchronized contracts and PostgreSQL-backed QA.\n\nCloses #39. Refs #27."
