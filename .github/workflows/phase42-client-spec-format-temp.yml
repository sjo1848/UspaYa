name: Phase 4.2 Client Spec Format Temporary

on:
  push:
    branches:
      - feat/web-customer-order-flow-v2

permissions:
  contents: write

jobs:
  format:
    if: ${{ contains(github.event.head_commit.message, '[run-client-spec-format]') && !contains(github.event.head_commit.message, '[client-spec-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-customer-order-flow-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/api/client.spec.ts
      - name: Guard changed paths
        run: test "$(git diff --name-only)" = "apps/web/src/api/client.spec.ts"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/api/client.spec.ts
          git commit -m "style: normalize API client spec [client-spec-format]"
          git push origin HEAD:feat/web-customer-order-flow-v2
