name: Phase 45 Format Once

on:
  push:
    branches:
      - feat/web-courier-flow

permissions:
  contents: write

jobs:
  format:
    if: ${{ contains(github.event.head_commit.message, '[run-phase45-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-courier-flow
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 4.5 sources
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/courier/CourierDeliveryFlow.vue \
            apps/web/src/courier/recovery.spec.ts \
            apps/web/src/courier/recovery.ts
      - name: Check formatted tree
        run: pnpm check
      - name: Persist formatting and self-clean
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase45-format-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: normalize Phase 4.5 sources"
          for attempt in 1 2 3 4 5; do
            git fetch origin feat/web-courier-flow
            if git rebase origin/feat/web-courier-flow && git push origin HEAD:feat/web-courier-flow; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
