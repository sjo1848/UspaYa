name: UI Bootstrap Temporary

on:
  push:
    branches:
      - feat/web-shadcn-foundation

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ contains(github.event.head_commit.message, '[run-ui-bootstrap]') && !contains(github.event.head_commit.message, '[ui-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/web-shadcn-foundation

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove external font dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/styles.css')
          text = path.read_text()
          text = text.replace("\n@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');\n", "")
          text = text.replace("--font-sans:\n    'Geist Variable', sans-serif;", "--font-sans:\n    ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;")
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/styles.css

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/styles.css
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "chore(web): keep UI fonts local [ui-bootstrap]"
          git push origin HEAD:feat/web-shadcn-foundation
