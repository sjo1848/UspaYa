name: UI Bootstrap Temporary

on:
  push:
    branches:
      - feat/web-shadcn-foundation

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ contains(github.event.head_commit.message, '[run-ui-bootstrap]') && !contains(github.event.head_commit.message, '[ui-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/web-shadcn-foundation

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Resolve workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Tailwind v4 for Vite
        run: pnpm --filter @uspaya/web add -D tailwindcss@^4 @tailwindcss/vite@^4 --save-exact

      - name: Initialize shadcn-vue with Tailwind v4
        run: |
          pnpm dlx shadcn-vue@latest init -d -t vite --base reka --base-color neutral --src-dir -c apps/web
          pnpm dlx shadcn-vue@latest add button input label card select badge alert separator skeleton -y -c apps/web

      - name: Commit generated UI foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(web): bootstrap shadcn-vue [ui-bootstrap]"
          git push origin HEAD:feat/web-shadcn-foundation
