name: Phase 4.3 Format Temporary

on:
  push:
    branches:
      - feat/web-merchant-order-flow

permissions:
  contents: write

jobs:
  format:
    if: ${{ contains(github.event.head_commit.message, '[run-phase43-format]') && !contains(github.event.head_commit.message, '[phase43-format-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-merchant-order-flow
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair merchant queue template
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/components/merchant/MerchantOrderFlow.vue')
          text = p.read_text()
          start = '''          <Button
            v-for="candidate in inboxOrders"
            v-else
            :key="candidate.orderId"'''
          replacement = '''          <template v-else>
            <Button
              v-for="candidate in inboxOrders"
              :key="candidate.orderId"'''
          if text.count(start) != 1:
              raise SystemExit(f'Expected one merchant inbox button block, found {text.count(start)}')
          text = text.replace(start, replacement, 1)
          end = '''          </Button>
        </CardContent>'''
          end_replacement = '''            </Button>
          </template>
        </CardContent>'''
          if text.count(end) < 1:
              raise SystemExit('Merchant inbox closing block not found')
          text = text.replace(end, end_replacement, 1)
          p.write_text(text)
          PY
      - name: Format Phase 4.3 files
        run: |
          pnpm exec prettier --write \
            apps/api/src/modules/ordering/http/merchant-order-read.controller.ts \
            apps/api/src/modules/ordering/http/orders.controller.ts \
            apps/api/src/modules/ordering/infrastructure/merchant-order-read.integration.test.ts \
            apps/api/src/modules/ordering/ordering.module.ts \
            apps/api/src/shared/http/request-context.ts \
            apps/api/src/shared/security/development-identity.guard.ts \
            apps/web/src/App.vue \
            apps/web/src/api/client.spec.ts \
            apps/web/src/api/client.ts \
            apps/web/src/components/merchant/MerchantOrderFlow.vue
      - name: Run static and unit gate
        run: pnpm check
      - name: Remove temporary workflow
        run: git rm .github/workflows/phase43-format-temp.yml
      - name: Guard scope and commit
        run: |
          unexpected="$(git diff HEAD --name-only | grep -Ev '^(.github/workflows/phase43-format-temp\.yml|apps/api/src/modules/ordering/http/merchant-order-read\.controller\.ts|apps/api/src/modules/ordering/http/orders\.controller\.ts|apps/api/src/modules/ordering/infrastructure/merchant-order-read\.integration\.test\.ts|apps/api/src/modules/ordering/ordering\.module\.ts|apps/api/src/shared/http/request-context\.ts|apps/api/src/shared/security/development-identity\.guard\.ts|apps/web/src/App\.vue|apps/web/src/api/client\.spec\.ts|apps/web/src/api/client\.ts|apps/web/src/components/merchant/MerchantOrderFlow\.vue)$' || true)"
          test -z "$unexpected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: normalize Phase 4.3 merchant flow [phase43-format-done]"
          for attempt in 1 2 3; do
            git fetch origin feat/web-merchant-order-flow
            git rebase origin/feat/web-merchant-order-flow
            if git push origin HEAD:feat/web-merchant-order-flow; then
              exit 0
            fi
            sleep 2
          done
          exit 1
