name: Phase 44 Final Gate

on:
  push:
    branches:
      - feat/web-operations-flow

permissions:
  contents: write

env:
  NODE_ENV: test
  DEV_IDENTITY_ENABLED: true
  API_PORT: 3000
  POSTGRES_DB: uspaya
  POSTGRES_USER: uspaya
  POSTGRES_PASSWORD: uspaya_dev_only
  POSTGRES_PORT: 5432
  DATABASE_URL: postgresql://uspaya:uspaya_dev_only@localhost:5432/uspaya?schema=public

jobs:
  final:
    if: ${{ contains(github.event.head_commit.message, '[run-phase44-final]') && !contains(github.event.head_commit.message, '[phase44-final-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-operations-flow
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Verify Phase 4.4 documentation
        run: |
          grep -q 'GET /operations/couriers/available' docs/04-application/API-001-rest-contract.md
          grep -q 'GET /operations/orders/pending-completion' docs/04-application/API-001-rest-contract.md
          grep -q 'Fase 4.4 — flujo Operaciones' docs/04-application/WEB-001-frontend-contract.md
          grep -q 'Frontend — Fases 4.1 a 4.4' README.md
          grep -q 'Cobertura Fase 4.4 — Operaciones' docs/05-qa/critical-order-scenarios.md
      - run: pnpm check
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U uspaya -d uspaya; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: pnpm test:integration
      - name: Clean temporary workflows and commit gate result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/phase44-final-gate.yml \
            .github/workflows/phase44-docs-once.yml \
            .github/workflows/phase44-docs-robust.yml
          git add -A
          git commit -m "chore: close Phase 4.4 final gate [phase44-final-done]"
          for attempt in 1 2 3 4 5; do
            git fetch origin feat/web-operations-flow
            if git rebase origin/feat/web-operations-flow && git push origin HEAD:feat/web-operations-flow; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
      - if: always()
        run: docker compose down -v
