name: Sync customer recovery docs once

on:
  push:
    branches:
      - feat/customer-active-order-recovery

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-active-order-recovery
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Synchronize recovery contracts
        run: |
          python3 .github/scripts/sync-customer-recovery-docs-once.py
          pnpm exec prettier --write README.md docs/04-application/API-001-rest-contract.md docs/04-application/WEB-001-frontend-contract.md
      - name: Commit docs and self-cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-customer-recovery-docs-once.yml .github/scripts/sync-customer-recovery-docs-once.py
          git add README.md docs/04-application/API-001-rest-contract.md docs/04-application/WEB-001-frontend-contract.md
          git commit -m 'docs: align customer active order recovery'
          git push origin HEAD:feat/customer-active-order-recovery
