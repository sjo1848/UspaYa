name: Format customer recovery once

on:
  push:
    branches:
      - feat/customer-active-order-recovery

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-active-order-recovery
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format scoped files
        run: |
          pnpm exec prettier --write \
            apps/api/src/modules/ordering/infrastructure/customer-order-read.integration.test.ts \
            apps/web/src/components/customer/CustomerActiveOrders.vue
      - name: Commit formatting and self-cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-customer-recovery-once.yml
          git add \
            apps/api/src/modules/ordering/infrastructure/customer-order-read.integration.test.ts \
            apps/web/src/components/customer/CustomerActiveOrders.vue
          git commit -m 'style: format customer active order recovery'
          git push origin HEAD:feat/customer-active-order-recovery
