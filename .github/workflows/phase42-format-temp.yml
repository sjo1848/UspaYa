name: Phase 4.2 Format Temporary

on:
  push:
    branches:
      - feat/web-customer-order-flow-v2

permissions:
  contents: write

jobs:
  format:
    if: ${{ contains(github.event.head_commit.message, '[run-phase42-format]') && !contains(github.event.head_commit.message, '[phase42-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/web-customer-order-flow-v2

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 4.2 sources
        run: |
          pnpm exec prettier --write \
            apps/api/src/api.integration.test.ts \
            apps/web/src/api/client.ts \
            apps/web/src/components/customer/CustomerOrderFlow.vue \
            apps/web/src/customer/order-intent.spec.ts

      - name: Guard changed paths
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(apps/api/src/api\.integration\.test\.ts|apps/web/src/api/client\.ts|apps/web/src/components/customer/CustomerOrderFlow\.vue|apps/web/src/customer/order-intent\.spec\.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected formatted paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/api.integration.test.ts \
            apps/web/src/api/client.ts \
            apps/web/src/components/customer/CustomerOrderFlow.vue \
            apps/web/src/customer/order-intent.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style: normalize Phase 4.2 sources [phase42-format]"
          git push origin HEAD:feat/web-customer-order-flow-v2
