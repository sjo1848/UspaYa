name: Phase 44 Docs Once

on:
  push:
    branches:
      - feat/web-operations-flow

permissions:
  contents: write

jobs:
  docs:
    if: ${{ contains(github.event.head_commit.message, '[run-phase44-docs]') && !contains(github.event.head_commit.message, '[phase44-docs-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-operations-flow
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Phase 4.4 docs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          api = 'docs/04-application/API-001-rest-contract.md'
          replace_once(
              api,
              'Fase 4.2 añade el read-model mínimo de descubrimiento de sucursales necesario para que el cliente\npueda iniciar el flujo sin conocer UUID internos. Fase 4.3 añade la bandeja abierta del comercio y\nendurece los alcances para conservar el rol que originó cada scope. Ninguno de estos read-models\ncambia los estados ni las reglas del dominio.',
              'Fase 4.2 añade el read-model mínimo de descubrimiento de sucursales necesario para que el cliente\npueda iniciar el flujo sin conocer UUID internos. Fase 4.3 añade la bandeja abierta del comercio y\nendurece los alcances para conservar el rol que originó cada scope. Fase 4.4 añade únicamente los\nread-models mínimos para descubrir repartidores disponibles y Pedidos que ya satisfacen la puerta\nde cierre. Ninguno de estos read-models cambia estados ni sustituye las validaciones transaccionales.'
          )
          replace_once(
              api,
              '### `POST /operations/deliveries/{deliveryId}/assign`',
              '''### `GET /operations/couriers/available`\n\nRol: `OPERATIONS`.\n\nDevuelve usuarios activos con rol `COURIER` que no poseen una `CourierAssignment` activa. La\nproyección contiene únicamente `courierId` y `displayName`, con orden estable por nombre e ID. No\nexpone email, teléfono ni credenciales. La lista es orientativa: `AssignCourier` vuelve a validar\nactividad, rol y exclusividad dentro de la transacción.\n\n### `POST /operations/deliveries/{deliveryId}/assign`'''
          )
          replace_once(
              api,
              '### `POST /operations/orders/{orderId}/complete`',
              '''### `GET /operations/orders/pending-completion`\n\nRol: `OPERATIONS`.\n\nRead-model mínimo para descubrir Pedidos que ya satisfacen la puerta observable de cierre:\n\n- `Order = FULFILLED`;\n- `Payment = CONFIRMED`;\n- `Delivery = DELIVERED`;\n- cero `CourierAssignment` activas.\n\nDevuelve `orderId`, versión, sucursal, total, moneda, estados financiero/logístico y fechas, con\norden estable por antigüedad e ID. `CompleteOrder` mantiene la autoridad final y revalida todas las\nprecondiciones y la versión dentro de la transacción.\n\n### `POST /operations/orders/{orderId}/complete`'''
          )

          web = 'docs/04-application/WEB-001-frontend-contract.md'
          replace_once(
              web,
              'Fase 4 en curso. Fase 4.1, fundación UI 4.1.1 y el flujo cliente 4.2 están cerrados. Fase 4.3\nmaterializa la bandeja y las transiciones mínimas del comercio sobre la vertical ya cerrada por\nAPI-001. Este documento gobierna la frontera web y no redefine estados, permisos ni reglas de\nnegocio.',
              'Fase 4 en curso. Fase 4.1, fundación UI 4.1.1, cliente 4.2 y comercio 4.3 están cerrados.\nFase 4.4 materializa la asignación manual, cierre y auditoría mínima de Operaciones sobre la vertical\nya cerrada por API-001. Este documento gobierna la frontera web y no redefine estados, permisos ni\nreglas de negocio.'
          )
          section = '''## Fase 4.4 — flujo Operaciones\n\nLa superficie se monta únicamente cuando `/actors/me` confirma rol `OPERATIONS`.\n\nRecorrido implementado:\n\n```text\nGET /operations/deliveries/unassigned\n+ GET /operations/couriers/available\n→ AssignCourier\n\nGET /operations/orders/pending-completion\n→ GET /orders/{orderId}\n→ CompleteOrder\n→ GET /operations/orders/{orderId}/audit\n```\n\n### Asignación manual\n\n- la UI combina la cola READY sin asignar ya existente con el read-model de repartidores\n  disponibles;\n- la selección visible no es autoridad: `AssignCourier` vuelve a validar rol, actividad, versión y\n  exclusividad dentro de la transacción;\n- cada mutación usa la `expectedVersion` observada;\n- doble toque queda bloqueado mientras existe una solicitud pendiente;\n- conflictos de versión o disponibilidad refrescan entregas y repartidores antes de otra acción.\n\nSi la red cae durante la asignación, la UI no asume fallo. Consulta `GET /orders/{orderId}`: una\nDelivery `ASSIGNED` al repartidor elegido confirma el resultado; `PENDING_ASSIGNMENT` permite un\nnuevo intento consciente; otro estado obliga a refrescar; una segunda caída mantiene la acción\nincierta y no repite a ciegas.\n\n### Cierre del Pedido\n\n- `GET /operations/orders/pending-completion` muestra solo candidatos cuya proyección satisface\n  `FULFILLED / CONFIRMED / DELIVERED` y sin asignación activa;\n- `CompleteOrder` conserva la autoridad transaccional y vuelve a comprobar la puerta completa;\n- un fallo de red se recupera mediante `GET /orders/{orderId}`: `COMPLETED` confirma éxito,\n  `FULFILLED` permite una nueva decisión consciente y cualquier otro estado obliga a refrescar.\n\n### Auditoría\n\nLa superficie reutiliza `GET /operations/orders/{orderId}/audit` para el Pedido seleccionado.\nMuestra acción, agregado, versión, fecha y actor de forma legible. La sanitización sigue siendo\nresponsabilidad del backend. No se incorpora búsqueda global ni exportación.\n\nFase 4.4 no implementa reasignación completa, cambio de modalidad, falta de repartidor con\nalternativas, fallback de PIN, incidencias/disputas, pagos/reembolsos operativos, GPS ni mapas.\n\n'''
          replace_once(web, '## Conectividad transversal', section + '## Conectividad transversal')
          replace_once(
              web,
              '### Fase 4.3\n\n- bandeja abierta del comercio sin UUID hardcodeado;\n- scopes de sucursal ligados al rol de origen;\n- detalle autoritativo reutilizado;\n- aceptación, inicio de preparación y READY;\n- READY permanece visible en la bandeja;\n- recuperación ante `VERSION_CONFLICT` y fallo de red;\n- estados visibles de Pedido, Pago y Entrega separados;\n- regresión de aislamiento para cuenta multirol.\n\n## Fuera de alcance actual',
              '''### Fase 4.3\n\n- bandeja abierta del comercio sin UUID hardcodeado;\n- scopes de sucursal ligados al rol de origen;\n- detalle autoritativo reutilizado;\n- aceptación, inicio de preparación y READY;\n- READY permanece visible en la bandeja;\n- recuperación ante `VERSION_CONFLICT` y fallo de red;\n- estados visibles de Pedido, Pago y Entrega separados;\n- regresión de aislamiento para cuenta multirol.\n\n### Fase 4.4\n\n- repartidores disponibles sin UUID hardcodeado ni datos personales innecesarios;\n- asignación manual desde interfaz con recuperación autoritativa;\n- Pedidos `FULFILLED` descubribles para cierre sin UUID hardcodeado;\n- cierre con `expectedVersion` y recuperación autoritativa;\n- auditoría acotada por Pedido desde la misma superficie;\n- helpers de recuperación probados para asignación y cierre.\n\n## Fuera de alcance actual'''
          )
          replace_once(
              web,
              '- superficies funcionales de operaciones y repartidor;',
              '- superficie funcional del repartidor;'
          )

          readme = 'README.md'
          replace_once(
              readme,
              'Fase 4.2 cerró el flujo funcional del cliente y Fase 4.3 materializa la superficie mínima del\ncomercio.',
              'Fase 4.2 cerró el flujo funcional del cliente, Fase 4.3 cerró la superficie mínima del comercio\ny Fase 4.4 materializa asignación, cierre y auditoría para Operaciones.'
          )
          replace_once(
              readme,
              'Todavía faltan las superficies funcionales de operaciones y repartidor, además de autenticación\nproductiva y validación local con actores reales.',
              'Todavía falta la superficie funcional del repartidor, además de autenticación productiva y\nvalidación local con actores reales.'
          )
          replace_once(
              readme,
              '- operaciones: cola de entregas y asignación manual;',
              '- operaciones: cola de entregas, repartidores disponibles, asignación manual y Pedidos pendientes de cierre;'
          )
          replace_once(readme, '### Frontend — Fases 4.1 a 4.3', '### Frontend — Fases 4.1 a 4.4')
          replace_once(
              readme,
              '- estados visibles en español y ciclos Pedido/Pago/Entrega separados.',
              '''- estados visibles en español y ciclos Pedido/Pago/Entrega separados;\n- Operaciones: entregas READY sin asignar + repartidores disponibles;\n- Operaciones: asignación manual con recuperación ante conflicto y resultado incierto;\n- Operaciones: Pedidos FULFILLED pendientes de cierre y `CompleteOrder`;\n- Operaciones: auditoría sanitizada por Pedido desde la misma superficie.'''
          )
          replace_once(
              readme,
              'GET  /api/v1/operations/deliveries/unassigned\nPOST /api/v1/operations/deliveries/{deliveryId}/assign',
              'GET  /api/v1/operations/deliveries/unassigned\nGET  /api/v1/operations/couriers/available\nPOST /api/v1/operations/deliveries/{deliveryId}/assign\nGET  /api/v1/operations/orders/pending-completion'
          )
          replace_once(
              readme,
              'Después de cerrar y fusionar Fase 4.3, el siguiente incremento funcional es **Fase 4.4 operaciones**:\ncola operativa, asignación manual desde interfaz, localización de pedidos `FULFILLED` pendientes de\ncierre y auditoría acotada por Pedido, reutilizando las mutaciones ya probadas por Fase 3.',
              'Después de cerrar y fusionar Fase 4.4, el siguiente incremento funcional es **Fase 4.5 repartidor**:\nentrega activa, retiro, transferencia de custodia, traslado, llegada y confirmación final desde la\ninterfaz, reutilizando la vertical ya probada por Fase 3.'
          )

          qa = 'docs/05-qa/critical-order-scenarios.md'
          scenarios = '''### Frontend Operaciones — Fase 4.4\n\n58. Solo `OPERATIONS` puede consultar repartidores disponibles y Pedidos pendientes de cierre.\n59. Repartidor ocupado, usuario inactivo y actor sin rol `COURIER` quedan fuera del read-model de\n    disponibilidad.\n60. El read-model de repartidores no expone email, teléfono ni credenciales.\n61. Una lista desactualizada no evita que `AssignCourier` revalide versión, rol, actividad y\n    exclusividad dentro de la transacción.\n62. Pedidos con Payment no `CONFIRMED`, Delivery no `DELIVERED`, Order no `FULFILLED` o asignación\n    activa no aparecen como pendientes de cierre.\n63. `CompleteOrder` vuelve a validar versión y puerta de cierre aunque el Pedido aparezca en la\n    lista.\n64. Un fallo de red durante `AssignCourier` obliga a leer el Pedido antes de permitir otra acción.\n65. La recuperación de asignación confirma éxito solo si Delivery está `ASSIGNED` al repartidor\n    elegido; `PENDING_ASSIGNMENT` queda conscientemente reintentable; otro estado exige refresco.\n66. Un fallo de red durante `CompleteOrder` obliga a leer el Pedido: `COMPLETED` confirma éxito,\n    `FULFILLED` queda conscientemente reintentable y otro estado exige refresco.\n67. Una segunda pérdida de red durante recuperación mantiene incertidumbre y no repite la mutación.\n68. La auditoría desde la UI continúa restringida a `OPERATIONS`, acotada al Pedido y sanitizada.\n69. La superficie muestra estados y acciones con copy comprensible y no expone enums como mensaje\n    principal.\n\n'''
          replace_once(qa, '## Cobertura HTTP implementada hasta Fase 3.7', scenarios + '## Cobertura HTTP implementada hasta Fase 3.7')
          coverage = '''## Cobertura Fase 4.4 — Operaciones\n\nLa superficie de Operaciones añade pruebas reproducibles para:\n\n- `GET /operations/couriers/available` con exclusión de repartidor ocupado, usuario inactivo y actor\n  sin rol `COURIER`;\n- proyección mínima de repartidores sin email;\n- `GET /operations/orders/pending-completion` con la puerta observable completa de cierre;\n- exclusión de Payment pendiente, Delivery no entregada, asignación activa y Order no `FULFILLED`;\n- rutas tipadas de asignación, cierre y auditoría en el `ApiClient` compartido;\n- helpers puros de recuperación para resultado incierto de asignación y cierre;\n- montaje de la superficie únicamente para rol efectivo `OPERATIONS`.\n\nLa lista de disponibilidad y la lista de cierre son read-models orientativos: las mutaciones siguen\nsiendo la autoridad y revalidan invariantes dentro de sus transacciones.\n\n'''
          replace_once(qa, '## Invariante atómica de entrega final', coverage + '## Invariante atómica de entrega final')
          PY
      - name: Format documentation
        run: |
          pnpm exec prettier --write README.md docs/04-application/API-001-rest-contract.md docs/04-application/WEB-001-frontend-contract.md docs/05-qa/critical-order-scenarios.md
          pnpm format:check
      - name: Commit docs and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase44-docs-once.yml
          git add -A
          git commit -m "docs: synchronize Phase 4.4 operations flow [phase44-docs-done]"
          for attempt in 1 2 3 4 5; do
            git fetch origin feat/web-operations-flow
            if git rebase origin/feat/web-operations-flow && git push origin HEAD:feat/web-operations-flow; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
