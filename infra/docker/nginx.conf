log_format uspaya_json escape=json '{'
  '"timestamp":"$time_iso8601",'
  '"level":"info",'
  '"service":"web",'
  '"event":"http_request",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"status":$status,'
  '"durationSeconds":$request_time,'
  '"correlationId":"$sent_http_x_correlation_id"'
  '}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  access_log /dev/stdout uspaya_json;
  error_log /dev/stderr warn;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"service":"web","status":"ok"}';
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
